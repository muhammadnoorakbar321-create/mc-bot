name: Minecraft AFK Bot 24/7

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/15****'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-node: '20'

    - name: Install Dependencies
      run: npm install mineflayer

    - name: Run Minecraft Bot
      run: |
        node -e "
        const mineflayer = require('mineflayer');
        const bot = mineflayer.createBot({
          host: 'THUNDERSSMP.enderman.cloud',
          port: 30988,
          username: 'AFK_Bot_Pro',
          version: false,
          auth: 'offline'
        });
        bot.on('spawn', () => console.log('✅ Bot Server Par Join Ho Gaya!'));
        bot.on('end', () => console.log('❌ Disconnected.'));
        bot.on('error', (err) => console.log('⚠️ Error: ' + err.message));
        
        // Bot ko 5 minute tak online rakhne ke liye loop (GitHub free hours safe rakhne ke liye)
        setTimeout(() => { console.log('Session complete.'); process.exit(0); }, 300000);
        "
